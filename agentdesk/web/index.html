<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDesk</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb; --accent: #2f6fde;
  --ok: #1f9d55; --warn: #c27c0e; --bad: #d64545; --chip: #eef1f6; --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #13161b; --panel: #1b1f26; --text: #e6e8ec; --muted: #9aa3af; --line: #2b313b; --accent: #5b8ef0;
          --ok: #3ccf7f; --warn: #e3a33a; --bad: #f06a6a; --chip: #252b34; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
@media (max-width: 820px) { body { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
aside h1 { font-size: 16px; margin: 0 0 8px; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; display: flex; align-items: center; }
aside h2 button { margin-left: auto; padding: 1px 8px; font-size: 12px; }
.proj { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.proj:hover { background: var(--chip); }
.proj.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.proj .n { font-weight: 600; } .proj .m { font-size: 12px; color: var(--muted); }
.acct { padding: 6px 10px; font-size: 13px; border-radius: 8px; background: var(--chip); }
.acct .m { font-size: 11px; color: var(--muted); word-break: break-all; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.dot.on { background: var(--ok); } .dot.live { background: var(--accent); }
.wrap { padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.top h2 { margin: 0; font-size: 18px; }
.top .m { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--bad); } button:disabled { opacity: .45; cursor: default; }
.pill { padding: 3px 10px; border-radius: 999px; background: var(--chip); font-size: 12px; }
.pill.live { color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card .k { color: var(--muted); font-size: 12px; } .card .v { font-size: 20px; font-weight: 600; } .card .s { color: var(--muted); font-size: 12px; }
.bar { height: 6px; background: var(--chip); border-radius: 4px; margin-top: 8px; overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--ok); }
.grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 14px; }
@media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
section > h3 { font-size: 13px; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
tr.task { cursor: pointer; } tr.task:hover { background: var(--chip); } tr.sel { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.st { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
.st.done { color: var(--ok); } .st.blocked { color: var(--bad); } .st.working, .st.routing { color: var(--accent); } .st.paused { color: var(--warn); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; } .muted { color: var(--muted); }
.detail { padding: 12px 14px; border-top: 1px solid var(--line); max-height: 360px; overflow: auto; }
pre { font: 12px/1.45 var(--mono); white-space: pre-wrap; margin: 6px 0; }
.detail h4 { font-size: 13px; margin: 10px 0 4px; }
.log { padding: 0 14px; max-height: 240px; overflow: auto; }
.msgs { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 300px; max-height: 520px; }
.msg { padding: 8px 11px; border-radius: 10px; max-width: 92%; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; } .msg.assistant { align-self: flex-start; background: var(--chip); }
.msg .tools { font-size: 11px; color: var(--muted); margin-top: 4px; }
.compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
textarea, input, select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
.compose textarea { flex: 1; resize: none; height: 54px; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 18px; width: min(520px, 94vw); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
dialog h3 { margin: 0 0 12px; } dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 3px; }
dialog input, dialog select, dialog textarea { width: 100%; } dialog textarea { height: 140px; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
code { font: 12px var(--mono); }
</style>
</head>
<body>
<aside>
  <h1>AgentDesk</h1>
  <h2>Projects <button onclick="openDlg('dProject')">+ Add</button></h2>
  <div id="projects"></div>
  <h2>Accounts <button onclick="openDlg('dAccount')">+ Add</button></h2>
  <div id="accounts"></div>
  <div class="spacer"></div>
  <div class="muted" style="font-size:11px" id="datadir"></div>
</aside>

<div class="wrap" id="main"><div class="empty">Add a project to start: <button class="primary" onclick="openDlg('dProject')">Add project</button></div></div>

<dialog id="dProject"><h3>Add project</h3>
  <label>Name</label><input id="pName" placeholder="Sintec.PDF">
  <label>Repository folder (a git repo)</label><input id="pRepo" placeholder="C:\path\to\repo">
  <label>Base branch tasks start from</label><input id="pBase" value="main">
  <label>Checks</label><select id="pPreset"></select>
  <label>Account</label><select id="pAccount"></select>
  <div class="row"><button onclick="closeDlg('dProject')">Cancel</button><button class="primary" onclick="addProject()">Add</button></div>
</dialog>

<dialog id="dAccount"><h3>Add account</h3>
  <label>Name</label><input id="aName" placeholder="work">
  <label>Kind</label><select id="aKind" onchange="$('aValueL').textContent = this.value === 'api_key' ? 'Environment variable holding the API key' : 'Login folder (empty: a new folder in AgentDesk data)'">
    <option value="subscription">Claude subscription (separate login)</option><option value="api_key">API key</option></select>
  <label id="aValueL">Login folder (empty: a new folder in AgentDesk data)</label><input id="aValue">
  <div class="muted" style="font-size:12px;margin-top:8px">Subscription accounts: after adding, press "Log in" and type <code>/login</code> in the window that opens. API keys are never stored by AgentDesk: set the environment variable before starting it.</div>
  <div class="row"><button onclick="closeDlg('dAccount')">Cancel</button><button class="primary" onclick="addAccount()">Add</button></div>
</dialog>

<dialog id="dTask"><h3>Add task</h3>
  <label>Title</label><input id="tTitle">
  <label>Tier</label><select id="tTier"><option value="">automatic (router decides)</option><option>mechanical</option><option>standard</option><option>hard</option></select>
  <label>Depends on (task ids, comma-separated)</label><input id="tDeps" placeholder="001, 002">
  <label>Description: goal, what's wrong, where, how to tell it's done</label><textarea id="tBody"></textarea>
  <div class="row"><button onclick="closeDlg('dTask')">Cancel</button><button class="primary" onclick="addTask()">Add</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n||0);
const money = n => "$" + ((n||0) < 1 ? (n||0).toFixed(3) : (n||0).toFixed(2));
const sumTok = t => (t?.input||0)+(t?.output||0)+(t?.cache_read||0)+(t?.cache_write||0);
let ov = null, cur = localStorage.getItem("agentdesk.project"), st = null, selTask = null, chatFor = null;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return r.json();
}
function openDlg(id) {
  if (id === "dProject") {
    $("pPreset").innerHTML = (ov?.presets||[]).map(p => `<option>${esc(p)}</option>`).join("");
    $("pAccount").innerHTML = (ov?.accounts||[]).map(a => `<option>${esc(a.name)}</option>`).join("");
  }
  $(id).showModal();
}
function closeDlg(id) { $(id).close(); }
function note(t) { if (chatFor) addMsg("assistant", "⚠ " + t); else alert(t); }

async function addProject() {
  const body = {name: $("pName").value, repo: $("pRepo").value, base: $("pBase").value, preset: $("pPreset").value, account: $("pAccount").value};
  let r = await api("/api/projects", body);
  if (r.needs_local_git) {
    if (!confirm(r.message + ".\n\nSet up local version tracking (stays on this computer)?\nNothing is pushed and no remote is added.")) return;
    r = await api("/api/projects", {...body, local_git: true});
  }
  if (r.error) return note(r.error);
  closeDlg("dProject"); cur = r.slug; localStorage.setItem("agentdesk.project", cur); refreshAll();
}
async function addAccount() {
  const r = await api("/api/accounts", {name: $("aName").value, kind: $("aKind").value, value: $("aValue").value});
  if (r.error) return note(r.error);
  closeDlg("dAccount"); refreshAll();
}
async function login(name) { const r = await api(`/api/accounts/${encodeURIComponent(name)}/login`, {}); if (r.error) note(r.error); }
async function addTask() {
  const r = await api(`/api/p/${cur}/tasks`, {title: $("tTitle").value, tier: $("tTier").value, depends: $("tDeps").value, body: $("tBody").value});
  if (r.error) return note(r.error);
  closeDlg("dTask"); $("tTitle").value = $("tBody").value = $("tDeps").value = ""; refresh();
}

async function refreshAll() {
  ov = await api("/api/overview");
  $("datadir").textContent = "Data: " + ov.data;
  if (!cur || !ov.projects.some(p => p.slug === cur)) cur = ov.projects[0]?.slug || null;
  $("projects").innerHTML = ov.projects.map(p => {
    const c = p.counts, done = c.done||0, total = Object.values(c).reduce((a,b)=>a+b,0);
    return `<div class="proj${p.slug===cur?" sel":""}" onclick="pickProject('${esc(p.slug)}')">
      <div class="n"><span class="dot${p.running?" live":""}"></span>${esc(p.name)}</div>
      <div class="m">${done}/${total} done${c.blocked?` · ${c.blocked} blocked`:""} · ${money(p.spent_usd)} · ${esc(p.account)}</div></div>`;
  }).join("") || `<div class="muted">No projects yet.</div>`;
  $("accounts").innerHTML = ov.accounts.map(a => {
    const lims = Object.values(a.usage||{}), u = lims.length ? Math.max(...lims.map(l => l.utilization||0)) : null;
    return `<div class="acct"><span class="dot${a.ready?" on":""}"></span><b>${esc(a.name)}</b> <span class="muted">${a.kind==="api_key"?"API key":"subscription"}</span>
      ${u!=null?` · ${Math.round(u*100)}% used`:""}
      <div class="m">${esc(a.where)}</div>
      ${a.kind!=="api_key"?`<button style="margin-top:4px;padding:2px 8px;font-size:12px" onclick="login('${esc(a.name)}')">Log in</button>`:""}</div>`;
  }).join("");
  refresh();
}
function pickProject(slug) { cur = slug; selTask = null; localStorage.setItem("agentdesk.project", slug); refreshAll(); }

function shell() {
  $("main").innerHTML = `
  <div class="top"><h2 id="pTitle"></h2><span class="m" id="pMeta"></span><span id="runstate" class="pill">idle</span><span class="spacer"></span>
    <button onclick="openDlg('dTask')">+ Task</button>
    <button class="primary" onclick="run('next')">Run next</button><button onclick="run('all')">Run all</button><button class="danger" onclick="stop()">Stop</button></div>
  <div class="stats">
    <div class="card"><div class="k">Spent by agents</div><div class="v num" id="spent"></div><div class="s" id="budget"></div></div>
    <div class="card"><div class="k">Tokens</div><div class="v num" id="tok"></div><div class="s num" id="tokd"></div></div>
    <div class="card"><div class="k">Account usage</div><div class="v num" id="rl">–</div><div class="bar"><i id="rlbar" style="width:0"></i></div><div class="s" id="rld">no reading yet</div></div>
    <div class="card"><div class="k">Chat</div><div class="v num" id="chatc"></div><div class="s num" id="chatt"></div></div>
  </div>
  <div class="grid">
    <section><h3>Tasks <span class="muted" id="tiers"></span></h3>
      <table><thead><tr><th>ID</th><th>Task</th><th>Status</th><th>Tier / model</th><th>Tokens</th><th>Cost</th><th></th></tr></thead><tbody id="tasks"></tbody></table>
      <div class="detail" id="detail"><span class="muted">Click a task for its brief, runs and result.</span></div></section>
    <section><h3>Assistant <span class="muted">ask about progress, or describe work to queue</span><span class="spacer"></span><button onclick="resetChat()">New chat</button></h3>
      <div class="msgs" id="msgs"></div>
      <div class="compose"><textarea id="input" placeholder="What's blocked and why? / Queue a task: …" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="primary" id="sendb" onclick="send()">Send</button></div></section>
  </div>
  <section><h3>Activity</h3><div class="log"><pre id="log"></pre></div></section>`;
}

async function refresh() {
  if (!cur) { $("main").innerHTML = `<div class="empty">Add a project to start: <button class="primary" onclick="openDlg('dProject')">Add project</button></div>`; return; }
  if (!$("tasks")) shell();
  try { st = await api(`/api/p/${cur}/state`); } catch { return; }
  if (st.error) return;
  if (chatFor !== cur) { chatFor = cur; $("msgs").innerHTML = ""; const h = await api(`/api/p/${cur}/chat`); for (const m of h.history) addMsg(m.role, m.text, m.tools); }
  const p = st.project, r = st.runner;
  $("pTitle").textContent = p.name;
  $("pMeta").textContent = `${p.repo} · base ${p.base} · account ${p.account}`;
  $("runstate").textContent = r.running ? "running: " + r.args.slice(0, 1).concat(r.args.slice(2)).join(" ") : (r.exit != null ? `idle (last exit ${r.exit})` : "idle");
  $("runstate").className = "pill" + (r.running ? " live" : "");
  $("spent").textContent = money(st.spent_usd); $("budget").textContent = "budget per run $" + st.limits.run_budget;
  $("tok").textContent = fmt(sumTok(st.tokens));
  $("tokd").textContent = `in ${fmt(st.tokens.input)} · out ${fmt(st.tokens.output)} · cache ${fmt((st.tokens.cache_read||0)+(st.tokens.cache_write||0))}`;
  $("chatc").textContent = money(st.chat.spent_usd); $("chatt").textContent = fmt(sumTok(st.chat.tokens)) + " tokens";
  const lims = Object.entries(st.usage||{});
  if (lims.length) {
    const [name, l] = lims.reduce((a, b) => ((b[1].utilization||0) > (a[1].utilization||0) ? b : a));
    const u = l.utilization ?? 0;
    $("rl").textContent = Math.round(u*100) + "%"; $("rlbar").style.width = Math.min(100, u*100) + "%";
    $("rlbar").style.background = u >= st.limits.pause_at ? "var(--bad)" : u >= .6 ? "var(--warn)" : "var(--ok)";
    $("rld").textContent = `${name}; pauses at ${Math.round(st.limits.pause_at*100)}%` + (l.resets_at ? `; resets ${new Date(l.resets_at*1000).toLocaleString()}` : "");
  }
  $("tiers").textContent = Object.entries(st.tiers).map(([k,v]) => `${k}: ${v.model}${v.effort?" ("+v.effort+")":""}`).join(" · ");
  $("tasks").innerHTML = st.tasks.map(t => {
    const models = [...new Set(t.runs.filter(x => x.tier !== "router").map(x => x.model))].join(" → ");
    return `<tr class="task${t.id===selTask?" sel":""}" onclick="pickTask('${esc(t.id)}')"><td class="num">${esc(t.id)}</td>
      <td>${esc(t.title)}${t.depends.length?`<div class="muted">after ${esc(t.depends.join(", "))}</div>`:""}</td>
      <td><span class="st ${esc(t.status)}">${esc(t.status)}</span></td><td>${esc(t.tier||"auto")}${models?`<div class="muted">${esc(models)}</div>`:""}</td>
      <td class="num">${fmt(sumTok(t.tokens))}</td><td class="num">${money(t.cost)}</td>
      <td><button onclick="event.stopPropagation();runMode('task','${esc(t.id)}')" ${t.status==="done"||r.running?"disabled":""}>Run</button></td></tr>`;
  }).join("") || `<tr><td colspan="7" class="muted">No tasks yet: press "+ Task" or describe the work in the chat.</td></tr>`;
  const box = $("log").parentElement, atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  $("log").textContent = st.log.join("\n") + (st.errors.length ? "\n\n— process output —\n" + st.errors.join("\n") : "");
  if (atEnd) box.scrollTop = box.scrollHeight;
  if (selTask) showDetail(false);
}

async function pickTask(id) { selTask = id; await showDetail(true); refresh(); }
let detailCache = null;
async function showDetail(fetchText) {
  const t = st?.tasks.find(x => x.id === selTask); if (!t) return;
  if (fetchText || !detailCache || detailCache.id !== selTask) detailCache = {id: selTask, ...(await api(`/api/p/${cur}/task/${encodeURIComponent(selTask)}`))};
  const d = detailCache;
  const runs = t.runs.map(x => `<tr><td>${esc(x.at||"")}</td><td>${esc(x.tier)}</td><td>${esc(x.model)}</td><td class="num">${x.attempt||""}</td><td class="num">${x.turns||""}</td><td class="num">${fmt(sumTok(x.tokens))}</td><td class="num">${money(x.cost_usd)}</td><td>${x.error?"error":""}</td></tr>`).join("");
  $("detail").innerHTML = `<b>${esc(t.id)}: ${esc(t.title)}</b> <span class="st ${esc(t.status)}">${esc(t.status)}</span>
    ${t.commit?` <span class="muted">branch ${esc(t.branch)} @ ${esc(t.commit)}</span>`:""}${t.why?`<div class="muted">Router: ${esc(t.why)}</div>`:""}
    ${runs?`<h4>Runs</h4><table><tr><th>When</th><th>Tier</th><th>Model</th><th>Try</th><th>Turns</th><th>Tokens</th><th>Cost</th><th></th></tr>${runs}</table>`:""}
    ${t.failure?`<h4>Last failure</h4><pre>${esc(t.failure)}</pre>`:""}
    ${d.report?`<h4>Report</h4><pre>${esc(d.report)}</pre>`:d.brief?`<h4>Brief</h4><pre>${esc(d.brief)}</pre>`:""}
    <h4>Task</h4><pre>${esc(d.body)}</pre>
    <div style="margin-top:8px"><button onclick="runMode('plan','${esc(t.id)}')">Preview plan</button> ${t.status==="done"?`<button onclick="runMode('final','${esc(t.id)}')">Run final checks</button>`:""}</div>`;
}

async function run(mode) { runMode(mode); }
async function runMode(mode, id) { const r = await api(`/api/p/${cur}/run`, {mode, id}); if (r.error) note(r.error); refresh(); }
async function stop() { const r = await api(`/api/p/${cur}/stop`, {}); if (r.error) note(r.error); refresh(); }

function addMsg(role, text, tools) {
  const div = document.createElement("div"); div.className = "msg " + role; div.innerHTML = md(text);
  if (tools && tools.length) { const t = document.createElement("div"); t.className = "tools"; t.textContent = "used: " + tools.join(", "); div.appendChild(t); }
  $("msgs").appendChild(div); $("msgs").scrollTop = $("msgs").scrollHeight; return div;
}
async function send() {
  const text = $("input").value.trim(); if (!text || !cur) return;
  $("input").value = ""; $("sendb").disabled = true; addMsg("user", text);
  const wait = addMsg("assistant", "…");
  try { const r = await api(`/api/p/${cur}/chat`, {text}); wait.remove(); addMsg("assistant", r.text || r.error, r.tools); }
  catch (e) { wait.textContent = "Error: " + e; }
  $("sendb").disabled = false; refreshAll();
}
async function resetChat() { await api(`/api/p/${cur}/chat/reset`, {}); $("msgs").innerHTML = ""; }

refreshAll();
setInterval(refresh, 2500);
setInterval(refreshAll, 10000);
</script>
</body>
</html>
