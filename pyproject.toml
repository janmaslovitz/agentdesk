[project]
name = "agentdesk"
dynamic = ["version"]
requires-python = ">=3.11"

[project.scripts]
agentdesk-serve = "agentdesk.serve:main"
agentdesk-server = "agentdesk.gateway.admin_cli:main"
agentdesk-gateway = "agentdesk.gateway.cli:main"

[tool.setuptools]
packages = ["agentdesk", "agentdesk.gateway"]

[tool.setuptools.dynamic]
version = { attr = "agentdesk.__version__" }
